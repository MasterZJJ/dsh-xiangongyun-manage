<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="The XGC image manager console: a tab rail, an alert strip, summary cards and an image table with size and cost columns">
  <rect x="0" y="0" width="640" height="300" rx="16" fill="#151b24"/>
  <rect x="0" y="0" width="640" height="300" rx="16" fill="none" stroke="#2b3546" stroke-width="2"/>

  <!-- window header -->
  <rect x="24" y="22" width="150" height="10" rx="5" fill="#7fb3ef"/>
  <rect x="492" y="18" width="92" height="20" rx="10" fill="#1f6fd0"/>
  <rect x="500" y="25" width="52" height="6" rx="3" fill="#dbe9fb"/>
  <rect x="596" y="22" width="12" height="12" rx="3" fill="#3a475c"/>

  <!-- tab rail -->
  <rect x="24" y="46" width="96" height="230" rx="10" fill="#1b2330" stroke="#2b3546"/>
  <rect x="36" y="60" width="64" height="9" rx="4.5" fill="#4d5b73"/>
  <rect x="36" y="82" width="64" height="9" rx="4.5" fill="#7fb3ef"/>
  <rect x="36" y="104" width="64" height="9" rx="4.5" fill="#4d5b73"/>
  <rect x="36" y="126" width="64" height="9" rx="4.5" fill="#4d5b73"/>
  <rect x="36" y="148" width="64" height="9" rx="4.5" fill="#4d5b73"/>
  <rect x="36" y="170" width="64" height="9" rx="4.5" fill="#4d5b73"/>

  <!-- alert strip -->
  <rect x="132" y="46" width="484" height="26" rx="8" fill="#3a2d14" stroke="#8a6a1c"/>
  <circle cx="148" cy="59" r="5" fill="#e0a83a"/>
  <rect x="162" y="55" width="196" height="8" rx="4" fill="#d9b877"/>

  <!-- summary cards -->
  <g>
    <rect x="132" y="82" width="114" height="58" rx="10" fill="#1b2330" stroke="#2b3546"/>
    <rect x="146" y="96" width="58" height="8" rx="4" fill="#5b6b85"/>
    <rect x="146" y="112" width="78" height="14" rx="7" fill="#7fb3ef"/>
  </g>
  <g>
    <rect x="256" y="82" width="114" height="58" rx="10" fill="#1b2330" stroke="#2b3546"/>
    <rect x="270" y="96" width="52" height="8" rx="4" fill="#5b6b85"/>
    <rect x="270" y="112" width="64" height="14" rx="7" fill="#6ed0a3"/>
  </g>
  <g>
    <rect x="380" y="82" width="114" height="58" rx="10" fill="#1b2330" stroke="#2b3546"/>
    <rect x="394" y="96" width="46" height="8" rx="4" fill="#5b6b85"/>
    <rect x="394" y="112" width="70" height="14" rx="7" fill="#c9d6e8"/>
  </g>
  <g>
    <rect x="504" y="82" width="112" height="58" rx="10" fill="#1b2330" stroke="#2b3546"/>
    <rect x="518" y="96" width="60" height="8" rx="4" fill="#5b6b85"/>
    <rect x="518" y="112" width="56" height="14" rx="7" fill="#e0a83a"/>
  </g>

  <!-- table -->
  <rect x="132" y="152" width="484" height="124" rx="10" fill="#1b2330" stroke="#2b3546"/>
  <rect x="146" y="164" width="456" height="8" rx="4" fill="#3a475c"/>
  <g fill="#232d3d">
    <rect x="146" y="182" width="456" height="22" rx="6"/>
    <rect x="146" y="210" width="456" height="22" rx="6"/>
    <rect x="146" y="238" width="456" height="22" rx="6"/>
  </g>
  <g fill="#7fb3ef">
    <rect x="158" y="189" width="112" height="8" rx="4"/>
    <rect x="158" y="217" width="86" height="8" rx="4"/>
    <rect x="158" y="245" width="128" height="8" rx="4"/>
  </g>
  <g fill="#6b7a91">
    <rect x="292" y="189" width="46" height="8" rx="4"/>
    <rect x="292" y="217" width="54" height="8" rx="4"/>
    <rect x="292" y="245" width="40" height="8" rx="4"/>
  </g>
  <g fill="#8b9ab2">
    <rect x="356" y="189" width="72" height="8" rx="4"/>
    <rect x="356" y="217" width="60" height="8" rx="4"/>
    <rect x="356" y="245" width="78" height="8" rx="4"/>
  </g>
  <g fill="#6ed0a3">
    <rect x="448" y="188" width="44" height="10" rx="5"/>
    <rect x="448" y="244" width="44" height="10" rx="5"/>
  </g>
  <rect x="448" y="216" width="44" height="10" rx="5" fill="#e0a83a"/>
  <g fill="#4d5b73">
    <rect x="516" y="189" width="72" height="8" rx="4"/>
    <rect x="516" y="217" width="72" height="8" rx="4"/>
    <rect x="516" y="245" width="72" height="8" rx="4"/>
  </g>

  <!-- progress bar of a running job -->
  <rect x="24" y="284" width="592" height="6" rx="3" fill="#232d3d"/>
  <rect x="24" y="284" width="248" height="6" rx="3" fill="#1f6fd0"/>
</svg>
